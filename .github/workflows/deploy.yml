name: Build and Deploy Frontend to Vercel

# Runs only when the user pushes to master — same trigger as before, just
# now with a working build environment. See CLAUDE.md's "Discoverability"
# section (Tier 3) and the discoverability_seo memory for why this exists:
# Vercel's own build container can't run Playwright (missing system
# libraries, no way to install them there), so the actual build — including
# the Playwright pre-rendering step — happens here instead, and the
# finished, ready-made files get handed to Vercel to just publish.
on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-deploy:
    # PINNED DELIBERATELY — do not change back to `ubuntu-latest`.
    #
    # On 2026-11-18 a deploy failed in 14s with:
    #   "Cannot install dependencies for ubuntu26.04-x64 with Playwright 1.60.0!
    #    ERROR: Playwright does not support chromium on ubuntu26.04-x64"
    # GitHub had rolled `ubuntu-latest` over to Ubuntu 26.04 while this project
    # sat idle for ~3 months, and the pinned Playwright (1.60.0) has no support
    # for it yet. Nothing in the repo changed — the runner moved underneath us.
    #
    # Pinning keeps this build reproducible and matches the environment the
    # pre-rendering was actually verified against. Bumping Playwright is the
    # other way out, but that should be a deliberate, separately-tested change
    # (prerender.mjs depends on real Playwright wait/navigation behaviour), not
    # something forced by a surprise OS rotation.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser + system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build (runs vite build + the Playwright pre-render script)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy pre-built output to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
